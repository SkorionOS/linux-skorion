name: Test patches integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILDDIR: "/tmp/build"

jobs:
  test-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container: archlinux:base-devel

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Create build user
        run: |
          useradd -m build
          cp -vR linux /home/build/linux
          chown -vR build /home/build/linux
          install -d -o build -g build "$BUILDDIR"
      - name: Set up pacman keyring
        run: |
          pacman-key --init
          pacman-key --populate archlinux
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm bc cpio pahole python kmod git
      - name: Test config verification
        run: python -m unittest discover -s tests -v
      - name: Prepare sources
        shell: bash
        run: |
          runuser -u build -- bash -lc 'cd /home/build/linux && makepkg --nobuild'
